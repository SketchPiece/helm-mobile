<text x="350" y="134" font-size="12" fill="#2E8C80">● Working 2:34</text>
<rect x="560" y="160" width="460" height="64" rx="14" fill="#DDD5C6"/>
<text x="580" y="186">Хочу удалённый рабочий стол в Helm Mobile,</text><text x="580" y="208">как в Chrome Remote Desktop.</text>
<text x="350" y="262">Посмотрел, как это сделано в Chrome Remote Desktop. Главное там —</text>
<text x="350" y="284">режим трекпада: курсор всегда на виду, а зум едет за ним.</text>
<text x="350" y="318" font-size="12" fill="#6E655A" font-family="Menlo, monospace">▸ Read remoting/client/ui/desktop_viewport.cc</text>
<text x="350" y="340" font-size="12" fill="#6E655A" font-family="Menlo, monospace">▸ Read remoting/client/trackpad_input_strategy.cc</text>
<text x="350" y="374">Предлагаю три раскладки экрана телефона и общую механику</text>
<text x="350" y="396">ввода. Канвас ниже.</text>
<rect x="350" y="420" width="300" height="120" rx="10" fill="#26211D"/>
<text x="366" y="446" fill="#E8A33D" font-size="12" font-family="Menlo, monospace">viewport.center = cursor</text>
<text x="366" y="468" fill="#D7D7D7" font-size="12" font-family="Menlo, monospace">clamp(viewport, desktop)</text>
<text x="366" y="490" fill="#D7D7D7" font-size="12" font-family="Menlo, monospace">pinch.pivot = cursor</text>
<text x="366" y="512" fill="#D7D7D7" font-size="12" font-family="Menlo, monospace">fling → cursor inertia</text>
</g>
