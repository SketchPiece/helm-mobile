name: HelmMobile
options:
  bundleIdPrefix: com.sketchpiece
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4KSA86792T
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    # The app and its test bundle both see `import Libtailscale` (module map next to the header).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/libtailscale
targets:
  HelmMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    sources:
      - path: HelmMobile
      - path: Shared
    dependencies:
      - target: HelmWidgets
      # Static library (scripts/build-libtailscale.sh rebuilds it; gitignored, 51 MB).
      - framework: Vendor/libtailscale/Libtailscale.xcframework
        embed: false
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: HelmMobile
        CODE_SIGN_ENTITLEMENTS: $(HELM_APP_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: HelmMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  HelmWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    sources:
      - path: HelmWidgets
      - path: Shared
      - path: HelmMobile/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: HelmWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: HelmWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  HelmMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HelmMobileTests
    dependencies:
      - target: HelmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sketchpiece.helm.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HelmMobile.app/HelmMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HelmMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HelmMobileUITests
    dependencies:
      - target: HelmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sketchpiece.helm.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HelmMobile
schemes:
  HelmMobile:
    build:
      targets:
        HelmMobile: all
        HelmMobileTests: [test]
        HelmMobileUITests: [test]
    test:
      targets:
        - HelmMobileTests
        - HelmMobileUITests
